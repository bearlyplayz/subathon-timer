<link href="https://fonts.googleapis.com/css2?family={{titleFontFamily}}&family={{timerFontFamily}}&family={{eventMessageFontFamily}}&family={{eventEffectFontFamily}}:wght@400;700&display=swap" rel="stylesheet" />


<div class="container">
  <h1 id="title">{{titleText}}</h1>

  <div id="event" class="event hide"><span class="event-message"></span><span class="event-effect"></span></div>

  <div id="timer" class="timer">
    <span id="hour" class="timer-font">00</span>
    <span class="sep timer-font">:</span>
    <span id="minute" class="timer-font">00</span>
    <span class="sep timer-font">:</span>
    <span id="second" class="timer-font">00</span>
  </div>
</div>
